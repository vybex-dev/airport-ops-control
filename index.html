<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Airport Operations Control Center — real-time-feeling operations dashboard for Indira Gandhi International Airport (DEL)."
    />
    <title>DEL Ops Control Center</title>

    <!--
      Critical inline CSS: sets background + font-family fallback BEFORE any
      external stylesheet or JS loads. Prevents blank white flash on mobile.
      Uses the same color tokens as index.css so there is zero visible shift.
    -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #0a0e14;
        color: #e8ecf2;
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!--
      Non-blocking font loading:
        1. preconnect — open TCP/TLS to Google Fonts early (before CSS runs)
        2. preload as="style" — fetch the font CSS without blocking parsing
        3. onload swap — once downloaded, upgrade rel to "stylesheet"
        4. <noscript> fallback — for browsers with JS disabled
      This eliminates the render-blocking Google Fonts stylesheet that was
      causing FCP delays of ~330 ms (mobile) on slow networks.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
